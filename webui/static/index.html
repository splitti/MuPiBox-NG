<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MuPiBox</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
<header class="statusbar">
  <a class="brand" href="/" aria-label="MuPiBox Startseite"><span class="logo">m</span><span>MuPiBox</span></a>
  <div class="system-status" aria-label="Systemstatus">
    <span id="wifi" class="signal-indicator" data-level="0" role="img" aria-label="Keine WLAN-Verbindung" title="WLAN-Status noch nicht verfügbar"><i></i><i></i><i></i><i></i></span>
    <span id="battery" class="battery-indicator" data-available="false" role="img" aria-label="Akkustatus nicht verfügbar" title="Akkustatus noch nicht verfügbar"><span class="battery-shell"><span class="battery-fill"></span><span class="battery-charge" aria-hidden="true">⚡</span></span></span>
    <span id="clock" role="button" tabindex="0" aria-label="Uhrzeit. Zwei Sekunden gedrückt halten, um die Administration zu öffnen."></span>
  </div>
</header>

<main id="content" class="content" aria-label="Medien"></main>

<footer class="playerbar" aria-label="Wiedergabe">
  <div id="art" class="mini-art" aria-hidden="true">♫</div>
  <div class="now-meta">
    <strong id="title">Such dir etwas aus</strong>
    <span id="album">Deine Medien warten auf dich.</span>
    <span id="track"></span>
  </div>
  <div class="transport">
    <button data-action="previous" aria-label="Vorheriger Titel">❮❮</button>
    <button id="toggle" class="primary" data-action="toggle" aria-label="Wiedergabe starten oder pausieren">▶</button>
    <button data-action="next" aria-label="Nächster Titel">❯❯</button>
  </div>
  <div class="player-tools">
    <div class="timeline"><span id="position">0:00</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="Wiedergabeposition" disabled><span id="duration">0:00</span></div>
    <label class="volume" aria-label="Lautstärke"><span>🔊</span><input id="volume" type="range" min="0" max="60" value="30"><output id="volume-label">30</output></label>
  </div>
</footer>

<div id="message" role="alert" hidden></div>
</body></html>
